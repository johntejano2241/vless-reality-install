name: Admin dashboard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, bcmath, zip, pcntl, xdebug
          tools: composer:v2
          coverage: none
      - name: Install application dependencies
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private bootstrap/cache
          composer install --no-interaction --prefer-dist
      - name: Test first-admin setup and administrator permissions
        run: php -d xdebug.mode=trace -d xdebug.start_with_request=yes -d xdebug.trace_format=1 -d xdebug.output_dir=/tmp -d xdebug.trace_output_name=esmi-trace -d log_errors=1 -d error_log=/tmp/esmi-php.log vendor/bin/phpunit --debug
      - name: Show PHP diagnostics on failure
        if: failure()
        run: |
          cat /tmp/esmi-php.log || true
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('/tmp').glob('esmi-trace*'):
              lines=path.read_text(errors='replace').splitlines()
              for line in lines[-250:]:
                  # Function names and locations only: never print trace arguments or environment values.
                  print('\t'.join(line.split('\t')[:10]))
          PY
      - name: Compile administrator views and assets
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          php artisan view:cache
          php artisan filament:assets
          php artisan route:list --except-vendor
          composer audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-composer-lock
          path: dashboard/composer.lock
      - name: Validate container deployment
        run: docker build --target web -f deploy/Dockerfile -t esmi-admin-ci .

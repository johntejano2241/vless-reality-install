name: Admin dashboard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, bcmath, zip, pcntl
          ini-file: development
          tools: composer:v2
          coverage: none
      - name: Install application dependencies
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private bootstrap/cache
          cp .env.example .env
          composer install --no-interaction --prefer-dist
      - name: Compile and lint administrator templates
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          php artisan view:cache
          find storage/framework/views -name '*.php' -exec php -l {} \;
      - name: Test first-admin setup and administrator permissions
        run: |
          php -d display_errors=1 -r 'require "vendor/autoload.php"; foreach(new RecursiveIteratorIterator(new RecursiveDirectoryIterator("app")) as $file) { if($file->getExtension()!=="php") continue; $class="App\\".str_replace("/","\\",substr($file->getPathname(),4,-4)); echo "Loading ".$class.PHP_EOL; class_exists($class); }'
          php -d display_errors=1 -d log_errors=1 -d error_log=/tmp/esmi-php.log vendor/bin/phpunit --debug
      - name: Show PHP diagnostics on failure
        if: failure()
        run: |
          cat /tmp/esmi-php.log || true
      - name: Compile administrator views and assets
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          php artisan view:cache
          php artisan filament:assets
          php artisan route:list --except-vendor
          composer audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-composer-lock
          path: dashboard/composer.lock
      - name: Validate container deployment
        run: docker build --target web -f deploy/Dockerfile -t esmi-admin-ci .
      - name: Prepare disposable VPN integration fixture
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
          curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest -o /tmp/esmi-release.json
          url=$(jq -er '.assets[] | select(.name=="Xray-linux-64.zip") | .browser_download_url' /tmp/esmi-release.json)
          digest=$(jq -er '.assets[] | select(.name=="Xray-linux-64.zip") | .digest' /tmp/esmi-release.json)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          curl -fsSL "$url" -o /tmp/esmi-xray.zip
          printf '%s  /tmp/esmi-xray.zip\n' "${digest#sha256:}" | sha256sum -c -
          unzip -p /tmp/esmi-xray.zip xray > /tmp/esmi-xray
          chmod +x /tmp/esmi-xray
          sudo env GITHUB_ACTIONS=true bash tests/smoke_upgrade.sh /tmp/esmi-xray
      - name: Test full dashboard installation and private provisioning
        working-directory: .
        run: sudo env GITHUB_ACTIONS=true bash tests/smoke_admin.sh
      - name: Show deployment diagnostics on failure
        if: failure()
        working-directory: .
        run: |
          if sudo test -f /etc/reality-vless-admin/compose.env; then
            sudo docker compose --env-file /etc/reality-vless-admin/compose.env -f /opt/reality-vless-admin/deploy/compose.yaml ps -a
            sudo docker compose --env-file /etc/reality-vless-admin/compose.env -f /opt/reality-vless-admin/deploy/compose.yaml logs --tail=60 app web worker scheduler
            sudo systemctl status reality-vless-admin-agent --no-pager || true
          fi
      - name: Browser acceptance
        working-directory: .
        run: |
          npm install --prefix /tmp/esmi-browser --ignore-scripts playwright
          /tmp/esmi-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/esmi-browser/node_modules node tests/browser_admin.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: admin-browser-previews
          path: /tmp/esmi-browser-shots/*.png

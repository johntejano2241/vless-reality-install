name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and lifecycle tests
        run: |
          bash -n install.sh upgrade.sh install-expiry.sh install-ip-limits.sh tests/smoke_upgrade.sh
          python3 -m unittest discover -s tests -v
          shellcheck install.sh upgrade.sh install-expiry.sh install-ip-limits.sh tests/smoke_upgrade.sh
      - name: Download verified Xray release
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
          curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest -o release.json
          url=$(jq -er '.assets[] | select(.name=="Xray-linux-64.zip") | .browser_download_url' release.json)
          digest=$(jq -er '.assets[] | select(.name=="Xray-linux-64.zip") | .digest' release.json)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          curl -fsSL "$url" -o xray.zip
          printf '%s  xray.zip\n' "${digest#sha256:}" | sha256sum -c -
          unzip -p xray.zip xray > xray
          chmod +x xray
      - name: Validate lifecycle configs with real Xray
        run: /usr/bin/python3 tests/validate_xray.py "$PWD/xray"
      - name: Smoke test existing-server upgrade on Ubuntu 22.04
        run: sudo env GITHUB_ACTIONS=true bash tests/smoke_upgrade.sh "$PWD/xray"
      - name: Test public-IP slots with real REALITY clients
        run: sudo env GITHUB_ACTIONS=true /usr/bin/python3 tests/smoke_ip_limits.py
      - name: Show service diagnostics on failure
        if: failure()
        run: sudo journalctl -u reality-vless -u reality-vless-expire -u reality-vless-limits --no-pager -n 80

